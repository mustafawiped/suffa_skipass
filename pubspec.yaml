name: suffa_skipass
description: "SuffaTech Skipass Mobile Application"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  bot_toast: ^4.1.3
  provider: ^6.1.1
  flutter_locales: ^3.0.1
  simple_snowfall: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:

  uses-material-design: true

  assets: 

    - assets/locales/en.json
    - assets/locales/ru.json
    - assets/locales/tr.json

    - assets/images/companylogo.png

    - assets/images/contents/skiers.png
    - assets/images/contents/fibers.jpg
    - assets/images/contents/pistes.png